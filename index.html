<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Full Road Packed</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<style>
body{margin:0;background:#000;color:white;text-align:center;font-family:Arial;overflow:hidden;touch-action:none}
#topBar{width:100%;max-width:420px;margin:0 auto;background:#000;color:#00ffcc;font-size:11px;padding:6px 2px;display:flex;justify-content:space-around;border-bottom:1px solid #ff0066}
#gameArea{width:360px;height:540px;margin:0 auto;position:relative;overflow:hidden;background:#1e2f45;border-left:10px solid; border-right:10px solid; border-image:linear-gradient(#ff0066,orange,yellow) 1}
#installBtn{position:absolute;top:35px;right:10px;z-index:999;background:#00ff88;color:black;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;display:none}
#controls{width:360px;margin:8px auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
#controls button{padding:16px 5px;background:#222;color:white;border:2px solid #00ffcc;border-radius:12px;font-weight:bold;font-size:13px}
#controls button:active{background:#00ffcc;color:black}
</style>
</head>
<body>
<div id="topBar"><span id="batTop">BAT:99%</span><span id="hitTop">HITS:0/3</span><span id="scoreTop">SCORE:0</span><span id="levelTop">LVL:1</span><span id="cityTop">LAHORE</span></div>
<div id="gameArea">
<button id="installBtn">📥 DOWNLOAD</button>
<canvas id="gameCanvas" width="360" height="540" style="width:100%;height:100%"></canvas>
</div>
<div id="controls">
<button id="leftBtn">◀ LEFT</button>
<button id="rightBtn">RIGHT ▶</button>
<button id="brakeBtn">▼ BRAKE</button>
<button id="boostBtn">▲ BOOST</button>
</div>

<script>
// ---- Aapka purana game logic same rahega ----
let canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
let player={x:160,y:450,w:26,h:46},keys={},battery=99,hits=0,maxHits=3,score=0,targetScore=2000,selectedRound=1,selectedCity={name:'LAHORE'},boost={x:100,y:-500},cities=[{name:'LAHORE'}];
function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,360,540);ctx.fillStyle='#00ff33';ctx.fillRect(player.x,player.y,player.w,player.h);}
// Controls for 4 buttons
document.getElementById('leftBtn').addEventListener('touchstart',()=>{player.x-=25;if(player.x<5)player.x=5;});
document.getElementById('rightBtn').addEventListener('touchstart',()=>{player.x+=25;if(player.x>330)player.x=330;});
document.getElementById('brakeBtn').addEventListener('touchstart',()=>{battery+=0.5});
document.getElementById('boostBtn').addEventListener('touchstart',()=>{player.y-=20;setTimeout(()=>player.y=450,200);});
document.getElementById('leftBtn').addEventListener('click',()=>{player.x-=25});
document.getElementById('rightBtn').addEventListener('click',()=>{player.x+=25});
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='b'&&battery>5){player.y-=30}});
window.addEventListener('keyup',e=>keys[e.key]=false);
loop();

// ---- DOWNLOAD / INSTALL LOGIC ----
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{
if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';}
else{alert('Mobile ke browser menu (3 dots) > Add to Home Screen / Install App pe click karo');}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
