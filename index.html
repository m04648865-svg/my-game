<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Full Road Packed</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">
<style>
body{margin:0;background:#0f0f0f;color:white;text-align:center;font-family:Arial;overflow:hidden;touch-action:none}
#road{width:340px;height:600px;background:linear-gradient(#222,#2b2b2b);margin:5px auto;position:relative;overflow:hidden;border-left:8px solid #fff;border-right:8px solid #fff;box-shadow:0 0 20px #000}
#car{width:58px;height:115px;position:absolute;bottom:25px;left:141px;z-index:10;transition:left 0.1s linear;
background-image:url('https://cdn-icons-png.flaticon.com/512/3774/3774087.png');
background-size:100% 100%;background-repeat:no-repeat;
filter:drop-shadow(0 0 6px gold);transform:rotate(0deg)}
.enemy{width:55px;height:110px;position:absolute;background-size:100% 100%;z-index:5}
.lane-line{position:absolute;width:10px;height:50px;background:#fff;left:165px;opacity:0.8}
h3{margin:8px;color:gold;text-shadow:0 0 5px red}
button{padding:16px 30px;margin:8px;background:linear-gradient(red,#a00);color:white;border:2px solid gold;border-radius:15px;font-size:18px;font-weight:bold;box-shadow:0 4px 10px #000}
#score{font-size:20px;font-weight:bold;color:#0f0}
</style>
</head>
<body>
<h3>🏁 Full Road Packed 🏁</h3>
<div id="score">Score: 0</div>
<div id="road">
<div id="car"></div>
</div>
<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>
<script>
let car=document.getElementById("car");
let road=document.getElementById("road");
let pos=141;
let score=0;
function moveLeft(){if(pos>15)pos-=30;car.style.left=pos+"px";}
function moveRight(){if(pos<265)pos+=30;car.style.left=pos+"px";}
document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')moveLeft();if(e.key=='ArrowRight')moveRight();});
// Touch swipe
let startX=0;road.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
road.addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-startX;if(diff<-30)moveLeft();if(diff>30)moveRight();});

// Enemy cars - real looking
const enemyCars=["https://cdn-icons-png.flaticon.com/512/3774/3774087.png","https://cdn-icons-png.flaticon.com/512/3774/3774143.png"];
setInterval(()=>{
let en=document.createElement("div");
en.className="enemy";
en.style.left=[20,100,180,260][Math.floor(Math.random()*4)]+"px";
en.style.top="-120px";
en.style.backgroundImage=`url(${enemyCars[Math.floor(Math.random()*2)]})`;
en.style.filter="hue-rotate("+(Math.random()*360)+"deg)";
road.appendChild(en);
let move=setInterval(()=>{en.style.top=(parseInt(en.style.top)+6)+"px";if(parseInt(en.style.top)>650){clearInterval(move);en.remove();score++;document.getElementById("score").innerText="Score: "+score;}
// collision
let carRect=car.getBoundingClientRect();let enRect=en.getBoundingClientRect();
let roadRect=road.getBoundingClientRect();
if(!(enRect.bottom<carRect.top||enRect.top>carRect.bottom||enRect.right<carRect.left||enRect.left>carRect.right)){alert("Game Over! Score: "+score);location.reload();}
},20);
},900);

// Road lines animation
setInterval(()=>{
let l=document.createElement("div");l.className="lane-line";l.style.top="-60px";l.style.left=Math.random()>0.5?"80px":"250px";road.appendChild(l);
let m=setInterval(()=>{l.style.top=(parseInt(l.style.top||-60)+8)+"px";if(parseInt(l.style.top)>650){clearInterval(m);l.remove();}},20);
},150);

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
