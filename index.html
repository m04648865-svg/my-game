<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Road Packed</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e60000">
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial;overflow:hidden}
#road{width:320px;height:520px;background:#2b2b2b;margin:10px auto;position:relative;overflow:hidden;border-left:6px solid white;border-right:6px solid white}
#car{width:50px;height:90px;background:#ff0000;position:absolute;bottom:20px;left:135px;border-radius:12px 12px 4px 4px;border:2px solid #fff;box-shadow:0 0 8px yellow}
#car::before{content:"";width:36px;height:22px;background:#87CEEB;position:absolute;top:12px;left:7px;border-radius:4px;border:1px solid white}
#car::after{content:"●   ●";position:absolute;bottom:2px;left:6px;font-size:10px;letter-spacing:8px}
.lane{position:absolute;width:10px;height:40px;background:white;left:155px;animation:move 1s linear infinite}
@keyframes move{0%{top:-50px}100%{top:600px}}
button{padding:14px 24px;margin:8px;background:red;color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h3>🏁 Full Road Packed 🏁</h3>
<div id="road">
<div id="car"></div>
</div>
<button onclick="moveLeft()">⬅️ LEFT</button>
<button onclick="moveRight()">RIGHT ➡️</button>

<script>
let car=document.getElementById("car");
let pos=135;
function moveLeft(){if(pos>15)pos-=25;car.style.left=pos+"px";}
function moveRight(){if(pos<255)pos+=25;car.style.left=pos+"px";}

// Road lines
let road=document.getElementById("road");
setInterval(()=>{
let l=document.createElement("div");
l.className="lane";
l.style.left=Math.random()>0.5?"70px":"230px";
road.appendChild(l);
setTimeout(()=>l.remove(),1000);
},200);

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
