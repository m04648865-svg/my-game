<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Road Packed - Earn Money</title>
<link rel="manifest" href="manifest.json">
<!-- GOOGLE ADSENSE - Yahan apna ID dalna hai approval ke baad -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh}
canvas{display:block;border:4px solid #f00}
#menu,#levelBox{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#000,#330000);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;padding:10px 0}
#levelBox{display:none;background:rgba(0,0,0,0.96);z-index:20}
#topBar{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#000;padding:5px 10px;border-radius:20px;border:2px solid #f00;display:flex;gap:6px;font-size:10px;z-index:5}
.car-dot{width:30px;height:45px;border-radius:5px;border:2px solid transparent;display:inline-block;margin:1px;cursor:pointer}
.car-dot.active{border-color:#0f0}
.city-btn{border:2px solid #333;background:#222;color:#fff;padding:6px;margin:3px;border-radius:6px;width:125px;font-size:11px;cursor:pointer}
.city-btn.active{border-color:#f00;background:#000}
.btn{padding:10px 24px;margin:5px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.btn-start{background:#ff0000;color:#fff}
.btn-next{background:#ffcc00;color:#000;padding:14px 35px;font-size:18px}
#controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;width:360px;z-index:100}
#controls button{padding:16px 5px;background:#222;color:#fff;border:2px solid #00ffcc;border-radius:12px;font-weight:bold;font-size:12px}
.ad-box{background:#111;border:1px dashed #555;width:320px;height:80px;margin:10px;display:flex;justify-content:center;align-items:center;color:#777;font-size:12px}
</style>
</head>
<body>
<div id="topBar"><span id="batTop">BAT:100%</span><span id="hitTop">HITS:0/3</span><span id="scoreTop">SCORE:0/5000</span><span id="levelTop">LVL:1/2000</span><span id="cityTop">LAHORE</span></div>
<div id="menu">
<h1 style="color:#f00">FULL ROAD PACKED!</h1>
<!-- AD BOX 1 - MENU ME -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-0000000000000000" data-ad-slot="0000000000" data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
Ad Yahan Ayega
</div>
<div id="menuLevelBox" style="background:#111;border:2px solid #ffcc00;padding:10px;border-radius:10px"><div id="menuLevelShow" style="color:#ffcc00;font-size:18px;font-weight:bold">LEVEL: 1 / 2000</div></div>
Level: <input type="number" id="roundInput" min="1" max="2000" value="1" style="padding:8px;width:90px;background:#111;color:#fff;border:2px solid #f00;border-radius:6px">
<div id="carSelect"></div><div id="cityGrid" style="display:flex;flex-wrap:wrap;justify-content:center;max-width:500px"></div>
<button class="btn btn-start" onclick="startGame()">START GAME</button>
</div>
<div id="levelBox"><h1 style="color:#f00">LEVEL COMPLETE!</h1><p id="levelShowBig" style="color:#ff0;font-size:32px">LEVEL 1 -> 2</p>
<!-- AD BOX 2 - LEVEL COMPLETE PE -->
<div class="ad-box">Level Complete Ad</div>
<button class="btn btn-next" onclick="nextLevel()">YES, NEXT LEVEL</button></div>
<canvas id="c" width="700" height="750"></canvas>
<div id="controls"><button id="leftBtn">◀ LEFT</button><button id="rightBtn">RIGHT ▶</button><button id="brakeBtn">▼ BRAKE</button><button id="boostBtn">▲ BOOST</button></div>
<script>
// ... AAPKA PURANA GAME CODE SAME RAHEGA - Yahan paste kiya hai ...
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let carList=[{col:'#e11d48'},{col:'#0ea5e9'},{col:'#facc15'},{col:'#ffffff'},{col:'#ff8c00'},{col:'#00ff00'}];
let cities=[{name:'LAHORE',bg:'#0a2a0a',side1:'#8B4513',side2:'#ffcc00'},{name:'KARACHI',bg:'#001a33',side1:'#005588',side2:'#00aaff'},{name:'ISLAMABAD',bg:'#0a2a1a',side1:'#228B22',side2:'#90EE90'},{name:'DUBAI',bg:'#4d3319',side1:'#DEB887',side2:'#f4a460'},{name:'TOKYO',bg:'#1a0033',side1:'#ff00ff',side2:'#00ffff'},{name:'MURREE',bg:'#cce6ff',side1:'#ffffff',side2:'#aaddff'},{name:'THAR',bg:'#cc9966',side1:'#8B7355',side2:'#ffcc88'},{name:'CYBER',bg:'#000011',side1:'#ff00ff',side2:'#00ffff'}];
let selectedCar=0,selectedRound=1,selectedCity=0,targetScore=5000,score=0,speed=8,hits=0,maxHits=3,battery=100;let player={x:326,y:600,w:48,h:90},traffic=[],boost={x:200,y:-800,w:26,h:26},keys={},gameStarted=false;
function updateMenuLevel(){let v=parseInt(document.getElementById('roundInput').value)||1;if(v<1)v=1;if(v>2000)v=2000;document.getElementById('menuLevelShow').innerText='LEVEL: '+v+' / 2000';selectedRound=v;}
const carSelectDiv=document.getElementById('carSelect');carList.forEach((c,i)=>{let d=document.createElement('div');d.className='car-dot'+(i==0?' active':'');d.style.background=c.col;d.onclick=()=>{selectedCar=i;document.querySelectorAll('.car-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');};carSelectDiv.appendChild(d);});
const cityGrid=document.getElementById('cityGrid');cities.forEach((ct,i)=>{let b=document.createElement('button');b.className='city-btn'+(i==0?' active':'');b.innerText=ct.name;b.onclick=()=>{selectedCity=i;document.querySelectorAll('.city-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};cityGrid.appendChild(b);});
function drawRealCar(x,y,w,h,col,isP){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(x+4,y+4,w,h);ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(x+5,y+15,w-10,30);ctx.fillStyle='#7dd3ff';ctx.fillRect(x+7,y+18,w-14,9);ctx.fillStyle=isP?'#ffeb3b':'#ff2222';ctx.fillRect(x+4,y+h-7,10,5);ctx.fillRect(x+w-14,y+h-7,10,5);ctx.fillStyle='#000';ctx.fillRect(x-3,y+10,5,12);ctx.fillRect(x+w-2,y+10,5,12);}
function drawCityRoad(id){let city=cities[id];ctx.fillStyle=city.bg;ctx.fillRect(0,0,700,750);ctx.fillStyle=city.side1;ctx.fillRect(0,0,50,750);ctx.fillRect(650,0,50,750);ctx.fillStyle='#222';ctx.fillRect(50,0,600,750);ctx.fillStyle=city.side2;ctx.fillRect(50,0,6,750);ctx.fillRect(644,0,6,750);ctx.fillStyle='#fff';for(let i=0;i<750;i+=45){ctx.fillRect(346,i+(score*6)%45,8,28);}}
function startGame(){selectedRound=parseInt(document.getElementById('roundInput').value)||1;speed=8+(selectedRound*0.1);document.getElementById('menu').style.display='none';gameStarted=true;loop();}
function nextLevel(){document.getElementById('levelBox').style.display='none';selectedRound++;selectedCity=(selectedCity+1)%cities.length;score=0;battery=100;hits=0;speed+=0.6;traffic=[];gameStarted=true;loop();}
function showLevelPermission(){gameStarted=false;document.getElementById('levelShowBig').innerText='LEVEL '+selectedRound+' -> '+(selectedRound+1);document.getElementById('levelBox').style.display='flex';}
function loop(){if(!gameStarted)return;drawCityRoad(selectedCity);ctx.fillStyle='#00ff66';ctx.beginPath();ctx.arc(boost.x+13,boost.y+13,12,0,Math.PI*2);ctx.fill();boost.y+=speed+4;if(boost.y>800){boost.y=-800;boost.x=60+Math.random()*500;}if(traffic.length<9&&Math.random()<0.12){let lanes=[75,195,326,445,570];let lane=lanes[Math.floor(Math.random()*5)];traffic.push({x:lane,y:-140,w:48,h:88,col:carList[Math.floor(Math.random()*carList.length)].col});}for(let car of traffic){car.y+=speed;drawRealCar(car.x,car.y,car.w,car.h,car.col,false);}traffic=traffic.filter(c=>c.y<850);if(keys['ArrowLeft']&&player.x>58)player.x-=10;if(keys['ArrowRight']&&player.x<594)player.x+=10;drawRealCar(player.x,player.y,player.w,player.h,carList[selectedCar].col,true);for(let car of traffic){if(player.x<car.x+car.w&&player.x+player.w>car.x&&player.y<car.y+car.h&&player.y+player.h>car.y){hits++;battery-=30;car.y=900;if(hits>=maxHits){alert('GAME OVER!');location.reload();return;}}}if(player.x<boost.x+24&&player.x+48>boost.x&&player.y<boost.y+24&&player.y+88>boost.y){battery+=20;if(battery>100)battery=100;boost.y=-800;if(hits>0)hits--;}battery-=0.022;if(battery<0){alert('BATTERY OVER!');location.reload();return;}document.getElementById('batTop').innerText='BAT:'+battery.toFixed(0)+'%';document.getElementById('hitTop').innerText='HITS:'+hits+'/'+maxHits;document.getElementById('scoreTop').innerText='SCORE:'+score+'/'+targetScore;document.getElementById('levelTop').innerText='LVL:'+selectedRound+'/2000';document.getElementById('cityTop').innerText=cities[selectedCity].name;score++;if(score>=targetScore){if(selectedRound>=2000){alert('WIN 2000!');location.reload();return;}showLevelPermission();return;}requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('leftBtn').addEventListener('touchstart',()=>keys['ArrowLeft']=true);document.getElementById('leftBtn').addEventListener('touchend',()=>keys['ArrowLeft']=false);
document.getElementById('rightBtn').addEventListener('touchstart',()=>keys['ArrowRight']=true);document.getElementById('rightBtn').addEventListener('touchend',()=>keys['ArrowRight']=false);
document.getElementById('brakeBtn').addEventListener('touchstart',()=>{speed=3});document.getElementById('brakeBtn').addEventListener('touchend',()=>{speed=8+(selectedRound*0.1)});
document.getElementById('boostBtn').addEventListener('touchstart',()=>{speed=15});document.getElementById('boostBtn').addEventListener('touchend',()=>{speed=8+(selectedRound*0.1)});
</script>
</body>
</html>
