<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;touch-action:none}
canvas{display:block;border:4px solid #f00}
#menu,#levelBox{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#000,#330000);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;padding:10px 0}
#levelBox{display:none;background:rgba(0,0,0,0.96);z-index:20}
.city-btn{border:2px solid #333;background:#222;color:#fff;padding:6px;margin:3px;border-radius:6px;cursor:pointer;width:125px;font-size:11px}
.city-btn.active{border-color:#f00;background:#000}
#topBar{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#000;padding:5px 10px;border-radius:20px;border:2px solid #f00;display:flex;gap:6px;font-weight:bold;font-size:10px;z-index:5;white-space:nowrap}
.car-dot{width:30px;height:45px;border-radius:5px;border:2px solid transparent;cursor:pointer;display:inline-block;margin:1px}
.car-dot.active{border-color:#0f0}
.btn{padding:10px 24px;margin:5px;font-size:14px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.btn-start{background:#f00;color:#fff} .btn-next{background:#ffcc00;color:#000}
.btn-download{background:#00c853;color:#fff;margin-top:10px}
#menuLevelBox{background:#111;border:2px solid #ffcc00;padding:10px 20px;border-radius:10px;margin:10px;text-align:center}
input{padding:8px;width:90px;text-align:center;border-radius:6px;border:2px solid #f00;background:#111;color:#fff}
#controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;display:none}
#dpad{position:relative;width:140px;height:140px;background:rgba(0,0,0,0.6);border-radius:20px;border:2px solid #f00}
.dbtn{position:absolute;width:50px;height:42px;border:none;border-radius:12px;font-weight:bold;color:#fff;cursor:pointer;font-size:12px}
#upBtn{top:5px;left:45px;background:#2196F3} #downBtn{bottom:5px;left:45px;background:#FF9800}
#leftBtn{top:49px;left:5px;background:#009688} #rightBtn{top:49px;right:5px;background:#009688}
</style>
</head>
<body>
<div id="topBar"><span id="batTop">BAT:100%</span> <span id="hitTop">HITS:0/3</span> <span id="scoreTop">SCORE:0/5000</span> <span id="levelTop">LVL:1/2000</span> <span id="cityTop">LAHORE</span></div>
<div id="menu"><h1 style="color:#f00">FULL ROAD PACKED!</h1><div id="menuLevelBox"><div style="color:#ffcc00;font-size:18px" id="menuLevelShow">LEVEL: 1 / 2000</div>Level: <input type="number" id="roundInput" value="1"></div><div id="carSelect"></div><div style="display:flex;flex-wrap:wrap;justify-content:center;max-width:500px" id="cityGrid"></div><button class="btn btn-start" onclick="startGame()">START GAME</button><button class="btn btn-download" onclick="downloadGame()">📥 DOWNLOAD GAME</button></div>
<div id="levelBox"><h1 style="color:#f00">LEVEL COMPLETE!</h1><button class="btn btn-next" onclick="nextLevel()">YES, NEXT LEVEL</button></div>
<canvas id="c" width="700" height="750"></canvas>
<div id="controls"><div id="dpad"><button id="upBtn" class="dbtn">▲ Aage</button><button id="leftBtn" class="dbtn">◀ Left</button><button id="rightBtn" class="dbtn">Right ▶</button><button id="downBtn" class="dbtn">▼ Peeche</button></div></div>
<script>
/* FULL GAME LOGIC SAME AS OLD + DOWNLOAD + 4 BUTTONS */
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let carList=[{col:'#e11d48'},{col:'#0ea5e9'},{col:'#facc15'},{col:'#ffffff'},{col:'#ff8c00'},{col:'#00ff00'}];
let cities=[{name:'LAHORE',bg:'#0a2a0a',side1:'#8B4513',side2:'#ffcc00'},{name:'KARACHI',bg:'#001a33',side1:'#005588',side2:'#00aaff'},{name:'ISLAMABAD',bg:'#0a2a1a',side1:'#228B22',side2:'#90EE90'},{name:'DUBAI',bg:'#4d3319',side1:'#DEB887',side2:'#f4a460'},{name:'TOKYO',bg:'#1a0033',side1:'#ff00ff',side2:'#00ffff'},{name:'MURREE',bg:'#cce6ff',side1:'#ffffff',side2:'#aaddff'},{name:'THAR',bg:'#cc9966',side1:'#8B7355',side2:'#ffcc88'},{name:'CYBER',bg:'#000011',side1:'#ff00ff',side2:'#00ffff'}];
let selectedCar=0,selectedRound=1,selectedCity=0,targetScore=5000,score=0,speed=8,hits=0,maxHits=3,battery=100;let player={x:326,y:600,w:48,h:90},traffic=[],boost={x:200,y:-800,w:26,h:26},keys={},gameStarted=false;
function updateMenuLevel(){let v=parseInt(document.getElementById('roundInput').value)||1;document.getElementById('menuLevelShow').innerText='LEVEL: '+v+' / 2000';selectedRound=v;}
function setLevel(v){document.getElementById('roundInput').value=v;updateMenuLevel();}
const carSelectDiv=document.getElementById('carSelect');carList.forEach((c,i)=>{let d=document.createElement('div');d.className='car-dot'+(i==0?' active':'');d.style.background=c.col;d.onclick=()=>{selectedCar=i;document.querySelectorAll('.car-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');};carSelectDiv.appendChild(d);});
const cityGrid=document.getElementById('cityGrid');cities.forEach((ct,i)=>{let b=document.createElement('button');b.className='city-btn'+(i==0?' active':'');b.innerText=ct.name;b.onclick=()=>{selectedCity=i;document.querySelectorAll('.city-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};cityGrid.appendChild(b);});
function drawRealCar(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();}
function drawCityRoad(id){let city=cities[id];ctx.fillStyle=city.bg;ctx.fillRect(0,0,700,750);ctx.fillStyle=city.side1;ctx.fillRect(0,0,50,750);ctx.fillRect(650,0,50,750);ctx.fillStyle='#222';ctx.fillRect(50,0,600,750);ctx.fillStyle=city.side2;ctx.fillRect(50,0,6,750);ctx.fillRect(644,0,6,750);ctx.fillStyle='#fff';for(let i=0;i<750;i+=45){ctx.fillRect(346,i+(score*6)%45,8,28);}}
function startGame(){selectedRound=parseInt(document.getElementById('roundInput').value)||1;speed=8+(selectedRound*0.1);document.getElementById('menu').style.display='none';document.getElementById('controls').style.display='flex';gameStarted=true;loop();}
function nextLevel(){document.getElementById('levelBox').style.display='none';selectedRound++;selectedCity=(selectedCity+1)%cities.length;score=0;battery=100;hits=0;speed+=0.6;traffic=[];document.getElementById('controls').style.display='flex';gameStarted=true;loop();}
function showLevelPermission(){gameStarted=false;document.getElementById('controls').style.display='none';document.getElementById('levelBox').style.display='flex';}
function downloadGame(){const html=document.documentElement.outerHTML;const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CarRacing-Game.html';a.click();URL.revokeObjectURL(url);alert('Download Ho Gaya! 📥');}
function loop(){if(!gameStarted)return;drawCityRoad(selectedCity);boost.y+=speed+4;if(boost.y>800){boost.y=-800;boost.x=60+Math.random()*500;}
if(traffic.length<9&&Math.random()<0.12){let lanes=[75,195,326,445,570];let lane=lanes[Math.floor(Math.random()*5)];traffic.push({x:lane,y:-140,w:48,h:88,col:carList[Math.floor(Math.random()*carList.length)].col});}
for(let car of traffic){car.y+=speed;drawRealCar(car.x,car.y,car.w,car.h,car.col);}
traffic=traffic.filter(c=>c.y<850);
if(keys['ArrowLeft']||keys['left'])player.x=Math.max(58,player.x-10);if(keys['ArrowRight']||keys['right'])player.x=Math.min(594,player.x+10);if(keys['ArrowUp']||keys['up'])player.y=Math.max(50,player.y-10);if(keys['ArrowDown']||keys['down'])player.y=Math.min(650,player.y+10);
drawRealCar(player.x,player.y,player.w,player.h,carList[selectedCar].col);
for(let car of traffic){if(player.x<car.x+car.w&&player.x+player.w>car.x&&player.y<car.y+car.h&&player.y+player.h>car.y){hits++;battery-=30;car.y=900;if(hits>=maxHits){alert('GAME OVER!');location.reload();return;}}}
battery-=0.022;document.getElementById('batTop').innerText='BAT:'+battery.toFixed(0)+'%';document.getElementById('hitTop').innerText='HITS:'+hits+'/'+maxHits;document.getElementById('scoreTop').innerText='SCORE:'+score+'/'+targetScore;score++;if(score>=targetScore){showLevelPermission();return;}requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{keys[e.key]=true;});window.addEventListener('keyup',e=>keys[e.key]=false);
function bindBtn(id,key){let b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true});b.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false});b.addEventListener('mousedown',()=>keys[key]=true);b.addEventListener('mouseup',()=>keys[key]=false);}
bindBtn('leftBtn','left');bindBtn('rightBtn','right');bindBtn('upBtn','up');bindBtn('downBtn','down');updateMenuLevel();
</script>
</body>
</html>
