<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car Racing 4D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
#gameBox{position:relative;width:360px;height:600px;background:#2c2c2c;overflow:hidden;border:3px solid #fff}
#playerCar{position:absolute;width:50px;height:80px;background:red;border-radius:10px;bottom:100px;left:155px;z-index:10;box-shadow:0 0 10px yellow}
.enemy{position:absolute;width:50px;height:80px;border-radius:10px}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
.btn{padding:14px 35px;font-size:20px;background:#00ff00;border:none;border-radius:10px;cursor:pointer;font-weight:bold}
.ctrl{position:absolute;bottom:5px;width:100%;height:140px;z-index:50;display:flex;justify-content:center;align-items:center}
.dpad{width:140px;height:140px;position:relative}
.dBtn{position:absolute;width:45px;height:45px;background:rgba(255,255,255,0.4);border:2px solid white;border-radius:8px;color:white;display:flex;justify-content:center;align-items:center;font-size:20px;user-select:none}
#up{top:0;left:47px} #down{bottom:0;left:47px} #left{top:47px;left:0} #right{top:47px;right:0}
</style>
</head>
<body>
<div id="gameBox">
<div id="playerCar"></div>
<div id="score" style="position:absolute;top:10px;left:10px;color:white;z-index:20;font-size:18px">Score: 0</div>
<div id="startScreen"><h1 style="color:white;margin-bottom:15px">Car Racing</h1><button class="btn" onclick="startGame()">START</button><p style="color:#ccc;margin-top:10px;font-size:13px;text-align:center">4 Buttons se Car Control<br>◀ ▶ ▲ ▼</p></div>
<div class="ctrl"><div class="dpad"><div class="dBtn" id="up">▲</div><div class="dBtn" id="down">▼</div><div class="dBtn" id="left">◀</div><div class="dBtn" id="right">▶</div></div></div>
</div>
<script>
let gameRunning=false,px=155,py=400,score=0,enemies=[],speed=4;
let car=document.getElementById('playerCar'),scoreEl=document.getElementById('score');
function startGame(){document.getElementById('startScreen').style.display='none';gameRunning=true;px=155;py=400;score=0;enemies.forEach(e=>e.el.remove());enemies=[];loop();spawn();}
let k={ArrowLeft:false,ArrowRight:false,ArrowUp:false,ArrowDown:false}
document.addEventListener('keydown',e=>{if(e.key in k)k[e.key]=true})
document.addEventListener('keyup',e=>{if(e.key in k)k[e.key]=false})
let press={l:false,r:false,u:false,d:false}
function bind(id,key){let el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();press[key]=true});el.addEventListener('touchend',()=>press[key]=false);el.addEventListener('mousedown',()=>press[key]=true);el.addEventListener('mouseup',()=>press[key]=false);el.addEventListener('mouseleave',()=>press[key]=false);}
bind('left','l');bind('right','r');bind('up','u');bind('down','d');
function loop(){if(!gameRunning)return;
if(k.ArrowLeft||press.l){px-=6} if(k.ArrowRight||press.r){px+=6}
if(k.ArrowUp||press.u){py-=6} if(k.ArrowDown||press.d){py+=6}
if(px<0)px=0;if(px>310)px=310;if(py<0)py=0;if(py>480)py=480;
car.style.left=px+'px';car.style.top=py+'px';
for(let i=enemies.length-1;i>=0;i--){let en=enemies[i];en.y+=speed;en.el.style.top=en.y+'px';if(en.y>620){en.el.remove();enemies.splice(i,1);score+=10;scoreEl.textContent='Score: '+score;continue;}if(en.y+80>py&&en.y<py+80&&Math.abs(en.x-px)<45){gameOver();return;}}
requestAnimationFrame(loop);
}
function spawn(){if(!gameRunning)return;let x=Math.random()*260;let d=document.createElement('div');d.className='enemy';d.style.left=x+'px';d.style.top='-90px';d.style.background=['blue','yellow','lime','orange','cyan'][Math.floor(Math.random()*5)];document.getElementById('gameBox').appendChild(d);enemies.push({x:x,y:-90,el:d});setTimeout(spawn,Math.max(300,1200-score*4));}
function gameOver(){gameRunning=false;document.getElementById('startScreen').style.display='flex';document.getElementById('startScreen').innerHTML='<h1 style=color:white>Game Over</h1><p style=color:white>Score: '+score+'</p><button class=btn onclick=startGame()>RESTART</button>';}
</script>
</body>
</html>
