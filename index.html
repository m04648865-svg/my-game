<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Road Packed</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial;overflow:hidden}
#gameBox{position:relative;width:360px;height:650px;margin:0 auto}
#road{width:100%;height:100%;background:#2a2a2a;position:relative;overflow:hidden;border-left:6px solid white;border-right:6px solid white}
#playerCar{width:60px;height:120px;position:absolute;bottom:20px;left:150px;z-index:20;
background:url('https://cdn-icons-png.flaticon.com/512/3774/3774087.png') no-repeat center;
background-size:100% 100%;filter:drop-shadow(0 0 8px yellow) brightness(1.2);
border-radius:15px 15px 5px 5px}
.enemy{width:58px;height:115px;position:absolute;background-size:100% 100%;z-index:10;border-radius:12px}
.centerLine{position:absolute;width:10px;height:40px;background:white;left:175px;opacity:0.9}
/* Buttons ko ek side pe */
#controls{position:absolute;right:5px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:6px}
#controls button{width:65px;height:45px;border:none;border-radius:12px;color:white;font-weight:bold;font-size:13px;box-shadow:0 3px 6px #000}
#aage{background:#2196F3} #leftBtn{background:#009688} #rightBtn{background:#009688} #peeche{background:#FF9800}
#topScore{padding:5px;background:red;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="topScore">Score: <span id="score">0</span></div>
<div id="gameBox">
<div id="road">
<div id="playerCar"></div>
</div>
<!-- Buttons ek side pe -->
<div id="controls">
<button id="aage">▲<br>Aage</button>
<div style="display:flex;gap:6px"><button id="leftBtn">◀ Left</button><button id="rightBtn">Right ▶</button></div>
<button id="peeche">▼<br>Peeche</button>
</div>
</div>
<script>
let car=document.getElementById("playerCar");
let road=document.getElementById("road");
let x=150,y=510;let score=0;
function updateCar(){car.style.left=x+"px";car.style.top=y+"px";}
document.getElementById("aage").onclick=()=>{if(y>10)y-=25;updateCar();}
document.getElementById("peeche").onclick=()=>{if(y<530)y+=25;updateCar();}
document.getElementById("leftBtn").onclick=()=>{if(x>10)x-=25;updateCar();}
document.getElementById("rightBtn").onclick=()=>{if(x<280)x+=25;updateCar();}

const enemyImgs=["https://cdn-icons-png.flaticon.com/512/3774/3774087.png","https://cdn-icons-png.flaticon.com/512/3774/3774143.png"];
setInterval(()=>{
let e=document.createElement("div");e.className="enemy";
e.style.left=[10,100,190,280][Math.floor(Math.random()*4)]+"px";
e.style.top="-130px";
e.style.backgroundImage=`url(${enemyImgs[Math.floor(Math.random()*2)]})`;
e.style.filter=`hue-rotate(${Math.random()*360}deg) brightness(0.9)`;
road.appendChild(e);
let mv=setInterval(()=>{
e.style.top=(parseInt(e.style.top)+5)+"px";
if(parseInt(e.style.top)>680){clearInterval(mv);e.remove();score++;document.getElementById("score").innerText=score;}
let r1=car.getBoundingClientRect(),r2=e.getBoundingClientRect();
if(!(r2.bottom<r1.top||r2.top>r1.bottom||r2.right<r1.left||r2.left>r1.right)){alert("Game Over! Score:"+score);location.reload();}
},18);
},1000);

setInterval(()=>{
let l=document.createElement("div");l.className="centerLine";l.style.top="-50px";road.appendChild(l);
let m=setInterval(()=>{l.style.top=(parseInt(l.style.top)+6)+"px";if(parseInt(l.style.top)>700){clearInterval(m);l.remove();}},18);
},120);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
